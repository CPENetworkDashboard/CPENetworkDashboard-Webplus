name: Service availability monitoring

on:
  workflow_dispatch:
  repository_dispatch:
    types: [status-probe]

permissions:
  contents: read

concurrency:
  group: cpe-service-monitor
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CPE_STATUS_ORIGIN: ${{ vars.CPE_STATUS_ORIGIN || 'https://cpe.plus' }}
      CPE_STATUS_TOKEN: ${{ secrets.CPE_STATUS_TOKEN }}
    steps:
      - name: Validate collector configuration
        run: |
          if [ -z "$CPE_STATUS_TOKEN" ]; then
            echo "::error::Set repository secret CPE_STATUS_TOKEN to match the existing EdgeKV configuration."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore unsent measurements
        uses: actions/cache/restore@v4
        with:
          path: .status-reports
          key: cpe-status-pending-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cpe-status-pending-
      - name: Check services and persist results
        run: node scripts/collect-status.mjs
      - name: Keep measurements for replay after outages
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .status-reports
          key: cpe-status-pending-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save collector diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: .status-reports/*.json
          if-no-files-found: ignore
          retention-days: 7
